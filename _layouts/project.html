---
layout: default
---
<article class="project-detail">
  <h1>{{ page.title }}</h1>
  <div class="project-meta">
    {% if page.tags %}
    <div class="tags">
      {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
    {% if page.github %}
    <a href="{{ page.github }}" class="project-link">GitHub</a>
    {% endif %}
    {% if page.demo %}
    <a href="{{ page.demo }}" class="project-link">Live Demo</a>
    {% endif %}
  </div>
  {{ content }}
</article>
